name: heygen-clone

services:
  n8n:
    build:
      context: ../n8n
      dockerfile: Dockerfile
    image: heygen-n8n-ffmpeg:2.40.5-portable
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - ../n8n/.env
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      NODES_EXCLUDE: '["n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'
      BROLL_RETRIEVAL_URL: http://vector:8766/search
    volumes:
      - type: bind
        source: ../n8n/data
        target: /home/node/.n8n
      - type: bind
        source: ../..
        target: /files/heygen-workflow

  vector:
    profiles: ["with-vector"]
    build:
      context: .
      dockerfile: Dockerfile.vector
    image: heygen-vector-cpu:2.11.0
    restart: unless-stopped
    environment:
      BROLL_VECTOR_BIND: 0.0.0.0
      HF_HOME: /files/heygen-workflow/runtime/vector-cache/models
    volumes:
      - type: bind
        source: ../..
        target: /files/heygen-workflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
